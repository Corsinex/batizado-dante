<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Ranking de Vendedores - Multiluz Solar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0a1628 100%);
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .particle {
    position: absolute;
    width: 3px; height: 3px;
    background: rgba(255,200,0,0.4);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 40px 20px 20px;
    animation: slideDown 0.8s ease;
  }

  @keyframes slideDown {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .logo-area { margin-bottom: 10px; }
  .logo-area .sun { font-size: 3.5rem; animation: rotateSun 10s linear infinite; display: inline-block; }
  @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  h1 {
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(90deg, #FFD700, #FF8C00, #FFD700);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: 0.95rem;
    margin-top: 5px;
    letter-spacing: 1px;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    border: 1px solid rgba(255,215,0,0.2);
    animation: fadeIn 1s ease 0.3s both;
  }

  .stat { text-align: center; }
  .stat-value { font-size: 1.8rem; font-weight: 900; color: #FFD700; }
  .stat-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .last-update {
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-size: 0.8rem;
    margin-bottom: 15px;
  }
  .update-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #00ff88;
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 2s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.7); }
  }

  .ranking-list { display: flex; flex-direction: column; gap: 12px; }

  .rank-item {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 15px 20px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: all 0.3s ease;
    animation: slideIn 0.5s ease both;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .rank-item::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
    transition: left 0.5s;
  }
  .rank-item:hover::before { left: 100%; }
  .rank-item:hover {
    transform: translateX(5px) scale(1.01);
    border-color: rgba(255,215,0,0.3);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 5px 20px rgba(255,215,0,0.15);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .rank-item.pos-1 {
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.08));
    border-color: rgba(255,215,0,0.5);
    box-shadow: 0 0 20px rgba(255,215,0,0.2);
  }
  .rank-item.pos-2 {
    background: linear-gradient(135deg, rgba(192,192,192,0.12), rgba(192,192,192,0.05));
    border-color: rgba(192,192,192,0.4);
  }
  .rank-item.pos-3 {
    background: linear-gradient(135deg, rgba(205,127,50,0.12), rgba(205,127,50,0.05));
    border-color: rgba(205,127,50,0.4);
  }

  .rank-position { font-size: 1.5rem; font-weight: 900; min-width: 55px; text-align: center; }
  .pos-1 .rank-position { color: #FFD700; text-shadow: 0 0 15px rgba(255,215,0,0.7); }
  .pos-2 .rank-position { color: #C0C0C0; text-shadow: 0 0 15px rgba(192,192,192,0.5); }
  .pos-3 .rank-position { color: #CD7F32; text-shadow: 0 0 15px rgba(205,127,50,0.5); }

  .medal { font-size: 1.8rem; min-width: 45px; text-align: center; }

  .seller-info { flex: 1; padding: 0 15px; }
  .seller-name {
    font-size: 1.1rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    color: #fff; margin-bottom: 5px;
  }
  .pos-1 .seller-name { color: #FFD700; }
  .pos-2 .seller-name { color: #E0E0E0; }
  .pos-3 .seller-name { color: #CD7F32; }

  .progress-container {
    height: 8px; background: rgba(255,255,255,0.1);
    border-radius: 10px; overflow: hidden; margin-top: 5px;
  }
  .progress-bar {
    height: 100%; border-radius: 10px;
    transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }
  .pos-1 .progress-bar { background: linear-gradient(90deg, #FFD700, #FF8C00); }
  .pos-2 .progress-bar { background: linear-gradient(90deg, #A0A0A0, #C0C0C0); }
  .pos-3 .progress-bar { background: linear-gradient(90deg, #A0522D, #CD7F32); }
  .rank-item:not(.pos-1):not(.pos-2):not(.pos-3) .progress-bar {
    background: linear-gradient(90deg, #4a90e2, #7b68ee);
  }

  .seller-count { text-align: right; min-width: 80px; }
  .count-number { font-size: 2rem; font-weight: 900; color: #FFD700; line-height: 1; }
  .count-label { font-size: 0.7rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

  .podium-crown {
    position: absolute; top: -5px; right: 10px;
    font-size: 1.2rem;
    animation: bounceCrown 2s ease-in-out infinite;
  }
  @keyframes bounceCrown {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-5px) rotate(5deg); }
  }

  .loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); }
  .spinner {
    width: 50px; height: 50px;
    border: 3px solid rgba(255,215,0,0.2);
    border-top-color: #FFD700;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(255,50,50,0.1);
    border: 1px solid rgba(255,50,50,0.3);
    border-radius: 10px; padding: 20px;
    text-align: center; color: #ff8080; margin: 20px 0;
  }
  .error-msg a { color: #4da6ff; }

  .confetti-container {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }
  .confetti-piece {
    position: absolute; width: 10px; height: 10px;
    animation: confettiFall 4s ease-in forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  footer {
    text-align: center; margin-top: 30px;
    padding: 20px; color: rgba(255,255,255,0.3); font-size: 0.8rem;
  }

  .rank-item:nth-child(1) { animation-delay: 0.05s; }
  .rank-item:nth-child(2) { animation-delay: 0.10s; }
  .rank-item:nth-child(3) { animation-delay: 0.15s; }
  .rank-item:nth-child(4) { animation-delay: 0.20s; }
  .rank-item:nth-child(5) { animation-delay: 0.25s; }
  .rank-item:nth-child(6) { animation-delay: 0.30s; }
  .rank-item:nth-child(7) { animation-delay: 0.35s; }
  .rank-item:nth-child(8) { animation-delay: 0.40s; }
  .rank-item:nth-child(9) { animation-delay: 0.45s; }
  .rank-item:nth-child(10) { animation-delay: 0.50s; }

  @media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    .rank-item { padding: 12px 15px; }
    .seller-name { font-size: 0.95rem; }
    .count-number { font-size: 1.5rem; }
    .stats-bar { gap: 15px; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="confetti-container" id="confetti"></div>

<div class="container">
  <header>
    <div class="logo-area">
      <span class="sun">&#9728;&#65039;</span>
    </div>
    <h1>&#127942; Ranking de Vendedores</h1>
    <p class="subtitle">Multiluz Solar &middot; Feira Multissetorial 2026</p>
  </header>

  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stat">
      <div class="stat-value" id="totalLeads">-</div>
      <div class="stat-label">Total Leads</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="totalVendedores">-</div>
      <div class="stat-label">Vendedores</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="topVendedor">-</div>
      <div class="stat-label">L&iacute;der</div>
    </div>
  </div>

  <div class="last-update" id="lastUpdate" style="display:none;">
    <span class="update-dot"></span>
    Atualizado em: <span id="updateTime">-</span>
    &nbsp;&middot;&nbsp; pr&oacute;xima em <span id="refreshSec">30</span>s
  </div>

  <div id="rankingContainer">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando ranking...</p>
    </div>
  </div>

  <footer>
    <p>&#9728;&#65039; Multiluz Solar &middot; Dados em tempo real &middot; Google Sheets</p>
  </footer>
</div>

<script>
// ================================================
//  CONFIGURACAO - edite apenas esta secao
// ================================================
var SHEET_ID        = '16Of-faCfyl36fMBZUClwT7t4lG5XpMDW58asRYozp9E';
var SHEET_NAME      = 'Respostas ao formul\u00e1rio 1';
var COLUMN_VENDEDOR = 'F';
var REFRESH_INTERVAL = 30; // segundos
// ================================================

var previousRanking = [];
var refreshTimer    = null;
var countdown       = REFRESH_INTERVAL;

/* ---- particulas de fundo ---- */
function createParticles() {
  var container = document.getElementById('particles');
  for (var i = 0; i < 30; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.left              = (Math.random() * 100) + '%';
    p.style.animationDuration = (Math.random() * 15 + 10) + 's';
    p.style.animationDelay    = (Math.random() * 15)      + 's';
    var sz = (Math.random() * 4 + 1) + 'px';
    p.style.width = p.style.height = sz;
    p.style.background =
      'rgba(255,' + Math.floor(Math.random() * 100 + 150) + ',0,' +
      (Math.random() * 0.5 + 0.2).toFixed(2) + ')';
    container.appendChild(p);
  }
}

/* ---- confetti ---- */
function launchConfetti() {
  var container = document.getElementById('confetti');
  container.innerHTML = '';
  var colors = ['#FFD700','#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7'];
  for (var i = 0; i < 50; i++) {
    var c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left             = (Math.random() * 100) + '%';
    c.style.top              = '-10px';
    c.style.background       = colors[Math.floor(Math.random() * colors.length)];
    c.style.transform        = 'rotate(' + (Math.random() * 360) + 'deg)';
    c.style.animationDelay    = (Math.random() * 2)       + 's';
    c.style.animationDuration = (Math.random() * 2 + 3)   + 's';
    c.style.borderRadius     = Math.random() > 0.5 ? '50%' : '0';
    container.appendChild(c);
  }
  setTimeout(function(){ container.innerHTML = ''; }, 5000);
}

/* ---- normalizar nomes (agrupa variantes) ---- */
function normalizeName(name) {
  var n = name.trim().toUpperCase().replace(/\s+/g, ' ');
  var map = {
    'BARBARA':'B\u00c1RBARA','B\u00c1RBARA':'B\u00c1RBARA','BARBAR\u00c1':'B\u00c1RBARA',
    'MICHEL':'MIGUEL',
    'GABRIEL BH':'GABRIEL BH','GABRIEL PH':'GABRIEL BH','GABRIEL bh':'GABRIEL BH',
    'IAN':'IAN','Ian':'IAN',
    'WILLANDER':'WILLIANDER',
    'CICERO':'C\u00cdCERO','C\u00cdCERO':'C\u00cdCERO','Cicero':'C\u00cdCERO',
    'WELSON':'WELSON','Welson':'WELSON',
    'EDMUNDO':'EDMUNDO','Edmundo':'EDMUNDO',
    'LINCOLN':'LINCOLN','Lincoln':'LINCOLN',
    'HUMBERTO':'HUMBERTO',
    'MESSIAS':'MESSIAS',
    'RODRIGO':'RODRIGO',
    'MARIA LUIZA':'MARIA LUIZA',
    'FABRICIO':'FABR\u00cdCIO','FABR\u00cdCIO':'FABR\u00cdCIO',
    'CAMILA':'CAMILA',
    'DANIEL':'DANIEL','Daniel':'DANIEL',
    'IAGO':'IAGO','Iago':'IAGO',
    'ANDRE':'ANDR\u00c9','ANDR\u00c9':'ANDR\u00c9','Andr\u00e9':'ANDR\u00c9'
  };
  return map[n] || n;
}

/* ---- buscar dados da planilha via gviz ---- */
function fetchSheetData() {
  return new Promise(function(resolve, reject) {
    var callbackName = '_gvizCb_' + Date.now();
    var query = 'select ' + COLUMN_VENDEDOR +
                ' where ' + COLUMN_VENDEDOR + " <> '' " +
                ' label ' + COLUMN_VENDEDOR + " ''";
    var url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:json&tq=' + encodeURIComponent(query) +
              '&sheet=' + encodeURIComponent(SHEET_NAME) +
              '&headers=1';

    var script = document.createElement('script');
    var done   = false;

    window[callbackName] = function(data) {
      done = true;
      delete window[callbackName];
      document.head.removeChild(script);
      try {
        if (data.status === 'error') {
          reject(new Error(data.errors && data.errors[0] ? data.errors[0].message : 'Erro na planilha'));
          return;
        }
        var rows   = (data.table && data.table.rows) ? data.table.rows : [];
        var counts = {};
        rows.forEach(function(row) {
          var val = row.c && row.c[0] && row.c[0].v;
          if (val && typeof val === 'string' && val.trim()) {
            var norm = normalizeName(val.trim());
            if (norm && norm !== 'N\u00c3O SEI' && norm !== 'NAO SEI' && norm.length > 1) {
              counts[norm] = (counts[norm] || 0) + 1;
            }
          }
        });
        var result = Object.keys(counts)
          .map(function(k){ return { name: k, total: counts[k] }; })
          .sort(function(a, b){ return b.total - a.total; });
        resolve(result);
      } catch(e) { reject(e); }
    };

    // usa tqx=out:json com callback inline
    var fetchUrl = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?tqx=out:json;responseHandler:' + callbackName +
      '&tq=' + encodeURIComponent(query) +
      '&sheet=' + encodeURIComponent(SHEET_NAME);

    script.src = fetchUrl;
    script.onerror = function(){
      if (!done) {
        done = true;
        delete window[callbackName];
        try { document.head.removeChild(script); } catch(e){}
        reject(new Error('Falha ao carregar dados. Verifique se a planilha est\u00e1 p\u00fablica.'));
      }
    };
    document.head.appendChild(script);
  });
}

/* ---- medalha por posicao ---- */
function getMedal(pos) {
  if (pos === 1) return '&#129351;';
  if (pos === 2) return '&#129352;';
  if (pos === 3) return '&#129353;';
  if (pos <= 5)  return '&#11088;';
  return '&#128312;';
}

/* ---- detectar mudanca ---- */
function hasRankingChanged(newRanking) {
  if (newRanking.length !== previousRanking.length) return true;
  for (var i = 0; i < newRanking.length; i++) {
    if (newRanking[i].name  !== previousRanking[i].name ||
        newRanking[i].total !== previousRanking[i].total) return true;
  }
  return false;
}

/* ---- renderizar ---- */
function renderRanking(ranking) {
  var container = document.getElementById('rankingContainer');
  var maxCount  = ranking[0] ? ranking[0].total : 1;
  var totalLeads = ranking.reduce(function(s, r){ return s + r.total; }, 0);

  document.getElementById('totalLeads').textContent     = totalLeads;
  document.getElementById('totalVendedores').textContent = ranking.length;
  document.getElementById('topVendedor').textContent    =
    ranking[0] ? ranking[0].name.split(' ')[0] : '-';
  document.getElementById('statsBar').style.display = 'flex';

  var now = new Date();
  document.getElementById('updateTime').textContent = now.toLocaleTimeString('pt-BR');
  document.getElementById('refreshSec').textContent = REFRESH_INTERVAL;
  document.getElementById('lastUpdate').style.display = 'block';

  var html = '<div class="ranking-list">';
  ranking.forEach(function(seller, idx) {
    var pos      = idx + 1;
    var posClass = pos <= 3 ? 'pos-' + pos : '';
    var pct      = Math.round((seller.total / maxCount) * 100);
    html += '<div class="rank-item ' + posClass + '" style="animation-delay:' + (idx * 0.07) + 's">';
    if (pos === 1) html += '<span class="podium-crown">&#128081;</span>';
    html += '<div class="rank-position">#' + pos + '</div>';
    html += '<div class="medal">' + getMedal(pos) + '</div>';
    html += '<div class="seller-info">';
    html +=   '<div class="seller-name">' + seller.name + '</div>';
    html +=   '<div class="progress-container">';
    html +=     '<div class="progress-bar" data-pct="' + pct + '" style="width:0%"></div>';
    html +=   '</div>';
    html += '</div>';
    html += '<div class="seller-count">';
    html +=   '<div class="count-number">' + seller.total + '</div>';
    html +=   '<div class="count-label">leads</div>';
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;

  setTimeout(function() {
    var bars = document.querySelectorAll('.progress-bar');
    for (var i = 0; i < bars.length; i++) {
      bars[i].style.width = bars[i].getAttribute('data-pct') + '%';
    }
  }, 100);

  if (previousRanking.length === 0 ||
      (previousRanking[0] && previousRanking[0].name !== ranking[0].name)) {
    setTimeout(launchConfetti, 500);
  }
  previousRanking = ranking.slice();
}

/* ---- mostrar erro ---- */
function showError(msg) {
  document.getElementById('rankingContainer').innerHTML =
    '<div class="error-msg">' +
    '<p>&#9888;&#65039; ' + msg + '</p>' +
    '<p style="margin-top:10px;font-size:.85rem;color:rgba(255,255,255,.5)">' +
    'A planilha precisa estar compartilhada como <strong>"qualquer pessoa com o link pode visualizar"</strong>.<br><br>' +
    '<a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit" target="_blank">&#128279; Abrir planilha</a>' +
    ' &rarr; Compartilhar &rarr; Qualquer pessoa com o link &rarr; Leitor' +
    '</p></div>';
}

/* ---- atualizar ---- */
function updateRanking() {
  fetchSheetData().then(function(ranking) {
    if (!ranking || ranking.length === 0) {
      showError('Nenhum dado encontrado na coluna de vendedores.');
      return;
    }
    if (hasRankingChanged(ranking)) {
      renderRanking(ranking);
    } else {
      var el = document.getElementById('updateTime');
      if (el) el.textContent = new Date().toLocaleTimeString('pt-BR');
    }
  }).catch(function(err) {
    console.error('Erro:', err);
    if (previousRanking.length === 0) showError(err.message);
  });
}

/* ---- countdown ---- */
function startCountdown() {
  countdown = REFRESH_INTERVAL;
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(function() {
    countdown--;
    var el = document.getElementById('refreshSec');
    if (el) el.textContent = countdown;
    if (countdown <= 0) {
      countdown = REFRESH_INTERVAL;
      updateRanking();
    }
  }, 1000);
}

/* ---- iniciar ---- */
window.addEventListener('load', function() {
  createParticles();
  updateRanking();
  startCountdown();
});
window.addEventListener('focus', function() {
  countdown = REFRESH_INTERVAL;
  updateRanking();
  startCountdown();
});
</script>
</body>
</html>
